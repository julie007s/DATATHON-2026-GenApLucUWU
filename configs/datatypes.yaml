# ==========================================
# CONFIG: datatypes.yaml
# ==========================================
# Purpose: Declare the desired data types for each column
#          in every CSV file.

# HOW TO READ:
#   - string   : Text / character string
#   - integer  : Whole number (1, 2, 3...)
#   - float    : Real number, decimal (1.5, 99.9...)
#   - datetime : Date and time (2024-01-15 or 2024-01-15 08:30:00)

customers:
  customer_id:       string
  customer_name:     string
  email:             string
  phone:             string
  address:           string
  city:              string
  province:          string
  zip:               string
  age_group:         string
  gender:            string
  registration_date: datetime

geography:
  zip:               string
  city:              string
  province:          string
  region:            string
  country:           string

products:
  product_id:        string
  product_name:      string
  category:          string
  segment:           string
  price:             float
  cogs:              float

promotions:
  promo_id:          string
  promo_code:        string
  discount_type:     string
  discount_value:    float
  min_order_value:   float
  start_date:        datetime
  end_date:          datetime
  applicable_category: string

orders:
  order_id:          string
  customer_id:       string
  order_date:        datetime
  order_status:      string
  payment_method:    string
  shipping_method:   string
  zip:               string
  promo_code:        string

order_items:
  order_item_id:     string
  order_id:          string
  product_id:        string
  quantity:          integer
  unit_price:        float
  discount_amount:   float

payments:
  payment_id:        string
  order_id:          string
  payment_method:    string
  payment_value:     float
  installments:      integer

shipments:
  shipment_id:       string
  order_id:          string
  shipping_date:     datetime
  delivery_date:     datetime
  shipping_status:   string
  shipping_fee:      float

reviews:
  review_id:         string
  order_id:          string
  product_id:        string
  rating:            integer        # Value from 1 to 5
  review_comment:    string

returns:
  return_id:         string
  order_id:          string
  product_id:        string
  return_date:       datetime
  return_reason:     string
  return_quantity:   integer
  refund_amount:     float

inventory:
  inventory_id:      string
  product_id:        string
  stock_on_hand:     integer
  units_received:    integer
  units_sold:        integer
  fill_rate:         float          # Stock fill rate (0.0 → 1.0)
  sell_through_rate: float          # Sell-through rate (0.0 → 1.0)
  last_updated:      datetime

sales:
  sale_id:           string
  product_id:        string
  date:              datetime
  units_sold:        integer
  revenue:           float
  cogs:              float

web_traffic:
  traffic_id:        string
  date:              datetime
  traffic_source:    string
  sessions:          integer
  unique_visitors:   integer
  bounce_rate:       float          # Bounce rate (0.0 → 1.0)
