# ==========================================
# CONFIG: features.yaml
# ==========================================
features:
  # ── ROW LEVEL ──────────────────────────
  - action: "add"
    name: "is_promotion"
    formula: "(df['promo_id'] != 'NO_PROMO') * 1"
    scope: "row"

  - action: "add"
    name: "delivery_days"
    formula: "(df['delivery_date'] - df['order_date']).dt.days"
    scope: "row"

  - action: "add"
    name: "is_low_stock"
    formula: "(df['stock_on_hand'] < 10) * 1"
    scope: "row"

  # ── DAILY LEVEL ────────────────────────
  - action: "add"
    name: "day_of_week"
    formula: "df['Date'].dt.dayofweek"
    scope: "daily"

  - action: "add"
    name: "month"
    formula: "df['Date'].dt.month"
    scope: "daily"

  - action: "add"
    name: "year"
    formula: "df['Date'].dt.year"
    scope: "daily"

  # ── REMOVE SAME-DAY LEAKY COLUMNS ─────
  - action: "remove"
    name:
      - "daily_order_count"
      - "daily_order_line_count"
      - "daily_total_item_revenue"
      - "daily_total_quantity"
      - "daily_total_cogs"
      - "avg_delivery_days"
      - "daily_promo_line_count"
      - "daily_promo_order_count"
      - "daily_return_risk_index"
      - "daily_stockout_rate"
      - "daily_avg_fill_rate"
      - "legacy_order_ratio"
      - "legacy_revenue_share"
      - "legacy_aov"
      - "new_customer_aov"
      - "daily_discount_amount"
      - "daily_gross_revenue_before_discount"
      - "daily_discount_depth"
      - "daily_mobile_order_ratio"
      - "daily_cod_order_ratio"
      - "aov"
      - "upt"
      - "market_era"
      - "daily_expected_margin_mix"
      - "promo_penetration_rate"
      - "size_mix_return_pressure"
      - "category_reason_weighted_return_risk"
      - "regional_revenue_concentration_index"
      - "customer_repurchase_cadence_index"
      - "payment_method_cancellation_risk"
      - "active_customer_demographic_mix_score"
      - "financing_intensity_index"
      - "high_intent_traffic_share"
      - "wt_sessions"
      - "wt_unique_visitors"
      - "wt_page_views"
      - "wt_bounce_rate"
      - "wt_avg_session_dur"
    scope: "daily"
