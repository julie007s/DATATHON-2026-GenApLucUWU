# ==========================================
# CONFIG: datatypes.yaml
# ==========================================
# Purpose: Declare the desired data types for each column
#          in every CSV file found in data/raw/.
# ==========================================

customers:
  customer_id:         string
  zip:                 string
  city:                string
  signup_date:         datetime
  gender:              string
  age_group:           string
  acquisition_channel: string

geography:
  zip:                 string
  city:                string
  region:              string
  district:            string

inventory:
  snapshot_date:       datetime
  product_id:          string
  stock_on_hand:       integer
  units_received:      integer
  units_sold:          integer
  stockout_days:       integer
  days_of_supply:      float
  fill_rate:           float
  stockout_flag:       integer
  overstock_flag:      integer
  reorder_flag:        integer
  sell_through_rate:   float
  product_name:        string
  category:            string
  segment:             string
  year:                integer
  month:               integer

orders:
  order_id:            string
  order_date:          datetime
  customer_id:         string
  zip:                 string
  order_status:        string
  payment_method:      string
  device_type:         string
  order_source:        string

order_items:
  order_id:            string
  product_id:          string
  quantity:            integer
  unit_price:          float
  discount_amount:     float
  promo_id:            string
  promo_id_2:          string

payments:
  order_id:            string
  payment_method:      string
  payment_value:       float
  installments:        integer

products:
  product_id:          string
  product_name:        string
  category:            string
  segment:             string
  size:                string
  color:               string
  price:               float
  cogs:                float

promotions:
  promo_id:            string
  promo_name:          string
  promo_type:          string
  discount_value:      float
  start_date:          datetime
  end_date:            datetime
  applicable_category: string
  promo_channel:       string
  stackable_flag:      integer
  min_order_value:     float

returns:
  return_id:           string
  order_id:            string
  product_id:          string
  return_date:         datetime
  return_reason:       string
  return_quantity:     integer
  refund_amount:       float

reviews:
  review_id:           string
  order_id:            string
  product_id:          string
  customer_id:         string
  review_date:         datetime
  rating:              integer
  review_title:        string

sales:
  Date:                datetime
  Revenue:             float
  COGS:                float

shipments:
  order_id:            string
  ship_date:           datetime
  delivery_date:       datetime
  shipping_fee:        float

web_traffic:
  date:                datetime
  sessions:            integer
  unique_visitors:     integer
  page_views:          integer
  bounce_rate:         float
  avg_session_duration_sec: float
  traffic_source:      string

sample_submission:
  Date:                datetime
  Revenue:             float
  COGS:                float
